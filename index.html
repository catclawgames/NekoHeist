<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141a3a">
<meta name="description" content="Lead a crew of cat burglars through trap-filled Japanese manors, steal the treasure, and build a base other players will try to rob.">
<title>Neko Heist</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#0b0e1e;overflow:hidden;touch-action:none}
  body{position:fixed;inset:0;width:100%}
  #g{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #sa{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
</style>
</head>
<body>
<!-- Shell page: the game (game.html) runs in this frame. The shell hosts the audio engine, so sound keeps
     playing while the game reloads its scene between the hub, heists and test heists. -->
<div id="sa"></div>
<iframe id="g" src="game.html" allow="autoplay; fullscreen" title="Neko Heist"></iframe>
<script>
window.NEKO_SHELL = true;
var g = document.getElementById('g'), sa = document.getElementById('sa');
// env(safe-area-inset-*) is always 0 inside an iframe on iOS, so the shell measures it and hands it to the game
window.__nekoInsets = function () { var cs = getComputedStyle(sa); return { top: cs.paddingTop, right: cs.paddingRight, bottom: cs.paddingBottom, left: cs.paddingLeft }; };
function pushInsets() { try { var d = g.contentDocument && g.contentDocument.documentElement, v = window.__nekoInsets(); if (!d) return; for (var k in v) d.style.setProperty('--sa-' + k, v[k]); g.contentWindow.dispatchEvent(new Event('resize')); } catch (e) {} }
g.addEventListener('load', function () { pushInsets(); try { g.focus(); } catch (e) {} });
addEventListener('resize', function () { pushInsets(); setTimeout(pushInsets, 300); });
addEventListener('orientationchange', function () { setTimeout(pushInsets, 300); setTimeout(pushInsets, 800); });
addEventListener('focus', function () { try { g.focus(); } catch (e) {} });
</script>
<script src="pwa.js"></script>
<script>/* the shell page never scrolls either: iOS sometimes leaves it offset after a rotation, which shifts every tap inside the game */
(function(){function u(){var d=document.documentElement,b=document.body;if(scrollX||scrollY||d.scrollTop||b.scrollTop){scrollTo(0,0);d.scrollTop=0;b.scrollTop=0}}
['resize','orientationchange','scroll','focusout','pageshow'].forEach(function(e){addEventListener(e,function(){u();setTimeout(u,120);setTimeout(u,500)},{passive:true})});
if(window.visualViewport){visualViewport.addEventListener('resize',function(){u();setTimeout(u,200)});visualViewport.addEventListener('scroll',u)}})();
</script>
</body>
</html>
